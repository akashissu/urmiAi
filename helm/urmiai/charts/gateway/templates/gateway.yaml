apiVersion: v1
kind: Secret
metadata:
  name: gateway-config
type: Opaque
stringData:
  DATABASE_URL: "postgres://gateway:{{ .Values.postgres.password }}@postgres:5432/gateway"
  GATEWAY_KEK: {{ .Values.crypto.kek | quote }}
  JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/db/migrate.js"]
          envFrom:
            - secretRef:
                name: gateway-config
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: gateway-config
          env:
            - name: LLM_BASE_URL
              value: {{ .Values.llm.baseUrl | quote }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: ALLOW_INTERNAL_UPSTREAMS
              value: {{ .Values.allowInternalUpstreams | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
