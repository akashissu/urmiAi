apiVersion: v1
kind: Service
metadata:
  name: notes-mcp
spec:
  type: ClusterIP
  selector:
    app: notes-mcp
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-mcp
  template:
    metadata:
      labels:
        app: notes-mcp
    spec:
      containers:
        - name: notes-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
