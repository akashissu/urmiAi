server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API and the MCP endpoint are served by the gateway. Proxying them
    # here means the browser only ever talks to one origin, so there is no
    # CORS configuration anywhere.
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /mcp {
        proxy_pass http://gateway:8080;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
